{% from 'object_macro.html' import object %}
{% macro record(xrecord, hlevel) -%}
<div class="defd"><span class="dhead">Record</span>
<h{{ hlevel }}>{{ xrecord.defid }}</h{{ hlevel }}>
<div class="lextype">{{ xrecord.type }}</div>
{% if xrecord.description %}
<p>{{ xrecord.description }}</p>
{% endif %}
<p><b>Key</b>: {{ key }}</p>
{{ object(record, hlevel + 1) }}
</div>
{%- endmacro %}
